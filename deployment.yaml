apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
      - name: flask-app-container
        image: my-flask-app:1.0
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_ENV
          value: production
        # app.py reads DATABASE_URL at import time and fails without it.
        # Create the secret first, e.g.:
        #   kubectl create secret generic flask-app-db \
        #     --from-literal=database-url='postgresql://user:password@host:5432/dbname'
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: flask-app-db
              key: database-url
        resources: # <<< ADD THIS SECTION
          requests:
            memory: "256Mi" # Request 256 Megabytes of RAM
            cpu: "1000m"  # Request 1 full CPU core
          limits:
            memory: "512Mi" # Limit to 512 Megabytes of RAM
            cpu: "2000m"  # Limit to 2 CPU cores (adjust based on your host's available cores)